[project]
name = "iil-promptfw"
version = "0.8.1"
description = "Prompt Template Framework — 5-layer Jinja2 template engine for LLM applications"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Achim Dehnert", email = "achim@dehnert.com"}
]
keywords = ["llm", "prompt", "template", "jinja2", "ai", "openai", "anthropic", "prompt-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tiktoken = [
    "tiktoken>=0.6",
]
hotreload = [
    "watchdog>=4.0",
]
django = [
    "django>=4.2",
    "pydantic>=2.0",
]
all = [
    "tiktoken>=0.6",
    "watchdog>=4.0",
    "django>=4.2",
    "pydantic>=2.0",
]
dev = [
    "pytest>=8.0",
    "django>=4.2",
    "pydantic>=2.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "tiktoken>=0.6",
]
testing = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[project.urls]
Homepage = "https://github.com/achimdehnert/promptfw"
Repository = "https://github.com/achimdehnert/promptfw"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptfw"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

# Freshness-Deklaration (platform:KONZ-018 W1-3, Pilot — generalisiert das
# produktive aifw-Muster aus install-iil-packages). Der generische Probe-Step
# in der Consumer-CI liest diese Sektion (Fetch von origin/main) und prüft:
# ist iil-promptfw >= freshness_min_version installiert, MUSS das importierte
# Modul jedes Symbol exportieren — sonst ist der Tool-Cache-Code STALE.
# Pflege-Regel (konservativ, R3): nur stabile Top-Level-API listen; ein neues
# Symbol erst aufnehmen, wenn das Release, das es einführt, publiziert ist —
# dann freshness_min_version auf dieses Release anheben.
[tool.iil-fleet]
freshness_min_version = "0.8"
freshness_symbols = [
    "PromptStack",
    "PromptTemplate",
    "RenderedPrompt",
    "TemplateLayer",
    "TemplateRegistry",
    "PromptRenderer",
    "TemplateNotFoundError",
    "TemplateRenderError",
    "extract_json",
    "extract_field",
]
